meta:
  version: 2
DESIGN_NAME: skew_lane
VERILOG_FILES:
- dir::../../../../build/sv2v/skew_lane.v
CLOCK_PORT: clk
CLOCK_PERIOD: 40
RUN_LINTER: false
SYNTH_STRATEGY: AREA 3
SYNTH_SHARE_RESOURCES: false
SYNTH_ABC_BUFFERING: false
SYNTH_HIERARCHY_MODE: keep
PL_TIME_DRIVEN: false
FP_IO_HLAYER: met3
FP_IO_VLAYER: met2
FP_PIN_ORDER_CFG: dir::skew_lane.pin_order.cfg
FP_SIZING: relative
FP_CORE_UTIL: 35
# Match mac_tmem_cell PDN pitch so compute_array can use uniform 50 um
# chip-level rails — every macro PG pin lands directly on a chip rail
# (works for R270-rotated b-skew too: 50 = 50 after rotation).
FP_PDN_VPITCH: 50
FP_PDN_HPITCH: 50
