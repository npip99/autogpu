meta:
  version: 2
DESIGN_NAME: tile_buf_8row
VERILOG_FILES:
- dir::../../../../build/sv2v/tile_buf_8row.v
CLOCK_PORT: clk
CLOCK_PERIOD: 40
RUN_LINTER: false
SYNTH_STRATEGY: AREA 3
SYNTH_SHARE_RESOURCES: false
SYNTH_ABC_BUFFERING: false
SYNTH_HIERARCHY_MODE: keep
PL_TIME_DRIVEN: false
FP_PIN_ORDER_CFG: dir::tile_buf_8row.pin_order.cfg
ERRORS_ON_UNMATCHED_IO: none
# met5 reserved for chip-level PDN — matches the pattern that fixed
# barrier/load/store. Cap signal routing at met4.
FP_IO_HLAYER: met3
FP_IO_VLAYER: met4
RT_MAX_LAYER: met4
# ~8 kb of FFs + 2 × 1024-bit port buses on the perimeter; modest util.
FP_SIZING: relative
FP_CORE_UTIL: 30
