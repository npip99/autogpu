meta:
  version: 2
DESIGN_NAME: mac_tmem_cell
VERILOG_FILES:
- dir::../../../../build/sv2v/chip_top.v
CLOCK_PORT: clk
CLOCK_PERIOD: 40
RUN_LINTER: false
SYNTH_STRATEGY: AREA 3
SYNTH_SHARE_RESOURCES: false
SYNTH_ABC_BUFFERING: false
SYNTH_HIERARCHY_MODE: keep
PL_TIME_DRIVEN: false
FP_IO_HLAYER: met3
FP_IO_VLAYER: met2
FP_PIN_ORDER_CFG: dir::mac_tmem_cell.pin_order.cfg
FP_SIZING: relative
FP_CORE_UTIL: 50
# Denser internal PDN so chip-level PDN finds a macro PIN to land on
# regardless of placement (Phase 7i-2b). Defaults are 153.6 / 153.18 µm
# matching chip-level pitch — works ONLY when placement is exactly on
# grid. Tighter pitch here makes the macro robust to off-grid placement
# at the cost of a bit more metal area inside the macro.
FP_PDN_VPITCH: 50
FP_PDN_HPITCH: 50
# Match parent (compute_array) FP_PDN_VOFFSET=HOFFSET=0 so internal PG
# pins land at the same met4/met5 PDK track tare as the chip-level
# straps — uniform grid across the whole die, no via-stitching reliance.
FP_PDN_VOFFSET: 0
FP_PDN_HOFFSET: 0
