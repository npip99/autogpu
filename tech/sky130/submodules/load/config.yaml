meta:
  version: 2
DESIGN_NAME: load
VERILOG_FILES:
- dir::../../../../build/sv2v/chip_top.v
CLOCK_PORT: clk
CLOCK_PERIOD: 100
RUN_LINTER: false
SYNTH_STRATEGY: AREA 3
SYNTH_SHARE_RESOURCES: false
SYNTH_ABC_BUFFERING: false
SYNTH_HIERARCHY_MODE: keep
PL_TIME_DRIVEN: false
FP_PIN_ORDER_CFG: dir::load.pin_order.cfg
ERRORS_ON_UNMATCHED_IO: none
FP_IO_HLAYER: met3
FP_IO_VLAYER: met4
RT_MAX_LAYER: met4
# Override load.sv's default INSTR_FIFO_DEPTH (256) for standalone synth.
# chip_top.sv passes LOAD_FIFO_DEPTH=8 anyway; this just makes the
# standalone-load synth match that.
SYNTH_PARAMETERS:
- "INSTR_FIFO_DEPTH=8"
FP_SIZING: absolute
DIE_AREA:
- 0
- 0
- 700
- 700
CORE_AREA:
- 50
- 50
- 650
- 650
