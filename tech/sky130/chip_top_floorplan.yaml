# Single source of truth for the chip_top floorplan.
#
# Adding a module to chip_top: one entry here + one instantiation in
# chip_top.sv + the module's own SV/config/pin_order.cfg in its
# submodule directory. The Makefile generates the real + stub
# chip_top configs from this file.
#
# Each entry specifies:
#   - instance: SV instance name (matches u_<mod> in chip_top.sv)
#   - location: [x, y] in microns (lower-left corner)
#   - orientation: N | S | E | W | FN | FS | FE | FW
#
# Coordinates follow FLOORPLAN.md adjacency map.
#
# Layout (units in µm; lower-left origin):
#
#   y=23000  ┌──────────────────────────────────────────────────┐
#            │                                                  │
#   y=20000  │ ┌────────┐┌──────┐┌────┐                          │
#            │ │ cmdproc││barrier││r_s │      ← north strip     │
#   y=19700  └─┴────────┴┴──────┴┴────┴─                        │
#            ┌─────────────────────────────────────────┐         │
#            │                                          │         │
#            │              compute_array               │         │
#            │              16700 × 16700               │         │
#   y=10000  │ ┌─────┐                                  │         │
#            │ │load │                                  │         │
#            │ └─────┘                                  │         │
#   y=3000   │ ┌─────┐                                  │         │
#            │ │smem │  ← abuts compute_array west      │         │
#            │ │3000×│                                  │         │
#            │ │7000 │                                  │         │
#   y=3000   └─┴─────┴──────────────────────────────────┴─        │
#                              ┌────────┐                         │
#                              │ store  │  ← abuts compute_array  │
#   y=600                      │2400×   │    south, centered      │
#                              │2400    │                         │
#   y=0                        └────────┘                         │
#            x=0  900 1000   4000      20700                21000
#
# Die: 21000 × 23000 µm = ~483 mm² (down from 750 mm² when the floorplan
# had ~5 mm of empty margin all around).

chip:
  die:       [26000, 30000]
  core:      [50, 50, 25950, 29950]

modules:
  cmdproc:
    instance: u_cmdproc
    location: [1000, 26000]      # west-aligned with smem/load; cmdproc.E=4000 (matches smem.E)
    orientation: N
  barrier:
    instance: u_barrier
    location: [5000, 26000]      # 1000 um east of cmdproc.E=4000; barrier.E=5652
    orientation: N
  reset_seq:
    instance: u_reset_seq
    location: [7000, 26000]      # 1348 um east of barrier.E=5652
    orientation: N
  load:
    instance: u_load
    location: [1000, 16000]      # west-aligned with smem; load over smem's west portion
    orientation: N
  smem:
    instance: u_smem
    location: [1000, 8000]       # smem.E=4000 (1000 um channel to compute_array.W=5000)
    orientation: N
  compute_array:
    instance: u_compute_array
    location: [5000, 4500]       # compute_array is 19500x19900 (per its config.yaml); occupies (5000,4500)..(24500,24400)
    orientation: N
  store:
    instance: u_store
    location: [11250, 1100]      # 1000 um channel to compute_array.S (y=4500); store.N=3500
    orientation: N
