<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GDS metal (all geometry + vias)</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d10;color:#bcd;font-family:system-ui,sans-serif;overflow:hidden}
  #hud{position:fixed;top:10px;left:12px;font-size:13px;line-height:1.5;opacity:.92;pointer-events:none;text-shadow:0 1px 2px #000}
  #hud b{color:#fff}
  #prompt{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,10,14,.55);font-size:22px;cursor:pointer}
  #prompt small{display:block;font-size:14px;opacity:.85;margin-top:10px;text-align:center}
  #err{position:fixed;top:50%;left:0;right:0;text-align:center;color:#f88;font-size:14px}
</style>
<script type="importmap">{ "imports": {
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/" }}</script></head>
<body>
<div id="hud"><b>GDS metal</b> · <span id="stat">loading…</span><br>
<span id="fps" style="color:#7fdc8f">— fps</span> · <span id="ginfo">—</span><br>
<span id="pose" style="color:#e0c070;pointer-events:auto;user-select:text;cursor:text">pose —</span><br>
mouse=look · WASD · Space/Shift=up/down · Ctrl=sprint · scroll=speed · Esc · P=copy pose</div>
<button id="copybtn" style="position:fixed;top:10px;right:12px;z-index:10;padding:6px 10px;font-size:13px;cursor:pointer;background:#1a1d24;color:#bcd;border:1px solid #345;border-radius:5px">copy pose</button>
<div id="prompt">click to fly<small>all GDS metal + via pillars, straight from the GDS (no DEF)</small></div>
<div id="err"></div>
<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const GLB = new URLSearchParams(location.search).get('glb') || '../out/gds_metal.glb';

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0b0d10);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.02,8000); scene.add(camera);
scene.add(new THREE.AmbientLight(0xffffff,1.0));
const dl=new THREE.DirectionalLight(0xffffff,0.45); dl.position.set(0.4,1,0.6); scene.add(dl);
const root=new THREE.Group(); root.rotation.x=-Math.PI/2; scene.add(root);

const controls=new PointerLockControls(camera,document.body), prompt=document.getElementById('prompt');
prompt.addEventListener('click',()=>controls.lock());
controls.addEventListener('lock',()=>prompt.style.display='none');
controls.addEventListener('unlock',()=>{prompt.style.display='flex'; for(const k in keys)keys[k]=false;});
const keys={}; addEventListener('keydown',e=>{keys[e.code]=true; if(['Space','ShiftLeft','ShiftRight'].includes(e.code))e.preventDefault();});
addEventListener('keyup',e=>{keys[e.code]=false;});
let speedMul=1.0; addEventListener('wheel',e=>{speedMul=Math.min(20,Math.max(0.05,speedMul*(e.deltaY<0?1.2:0.83)));},{passive:true});
const stat=document.getElementById('stat'), fpsEl=document.getElementById('fps'), ginfoEl=document.getElementById('ginfo'), poseEl=document.getElementById('pose');
const DEG=180/Math.PI;
function poseStr(){ const p=camera.position, e=new THREE.Euler().setFromQuaternion(camera.quaternion,'YXZ');
  return `layoutX=${p.x.toFixed(1)} layoutY=${(-p.z).toFixed(1)} height=${p.y.toFixed(2)}µm | yaw=${(e.y*DEG).toFixed(1)}° pitch=${(e.x*DEG).toFixed(1)}° roll=${(e.z*DEG).toFixed(1)}°`; }
function copyPose(){ const s=poseStr(); let ok=false;
  try{ const ta=document.createElement('textarea'); ta.value=s; ta.style.position='fixed'; ta.style.opacity='0';
       document.body.appendChild(ta); ta.focus(); ta.select(); ok=document.execCommand('copy'); document.body.removeChild(ta); }catch(e){}
  const btn=document.getElementById('copybtn'); btn.textContent=ok?'✓ copied':'⌫ select'; poseEl.textContent=s;
  setTimeout(()=>{btn.textContent='copy pose';},1500); }
document.getElementById('copybtn').addEventListener('click',copyPose);
addEventListener('keydown',e=>{ if(e.code==='KeyP') copyPose(); });

new GLTFLoader().load(GLB,(g)=>{
  const box=new THREE.Box3();
  g.scene.traverse(o=>{ if(o.isMesh){
    o.material=new THREE.MeshStandardMaterial({vertexColors:true,metalness:0,roughness:0.85,side:THREE.FrontSide});
    o.geometry.computeBoundingBox(); box.union(o.geometry.boundingBox); root.add(o);
  }});
  const c=box.getCenter(new THREE.Vector3()), s=box.getSize(new THREE.Vector3()), span=Math.max(s.x,s.y,8);
  // place camera SE of center, low and looking in — best angle to see verticals connect
  camera.position.set(c.x+span*0.4, span*0.5, -c.y+span*0.6); camera.lookAt(c.x,1,-c.y);
  let nf=0; g.scene.traverse(o=>{ if(o.isMesh) nf+=o.geometry.index? o.geometry.index.count/3 : 0; });
  stat.textContent=`${(nf/1e6).toFixed(2)}M faces · GDS window`;
},()=>{},e=>{document.getElementById('err').textContent='load error: '+e; console.error(e);});

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const clock=new THREE.Clock(), up=new THREE.Vector3(0,1,0);
let fLast=performance.now(), fFrames=0;
(function loop(){ requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.1); fFrames++; const now=performance.now();
  if(now-fLast>=500){ fpsEl.textContent=(fFrames*1000/(now-fLast)).toFixed(0)+' fps';
    const i=renderer.info.render; ginfoEl.textContent=`${i.calls} draws · ${(i.triangles/1e6).toFixed(1)}M tris`; poseEl.textContent=poseStr(); fLast=now; fFrames=0; }
  if(controls.isLocked){ const alt=Math.max(0.5,Math.abs(camera.position.y));
    let v=alt*speedMul*(keys['ControlLeft']||keys['ControlRight']?5:1)*dt;
    const fwd=(keys['KeyW']?1:0)-(keys['KeyS']?1:0), rgt=(keys['KeyD']?1:0)-(keys['KeyA']?1:0), vert=(keys['Space']?1:0)-(keys['ShiftLeft']||keys['ShiftRight']?1:0);
    const fdir=new THREE.Vector3(); camera.getWorldDirection(fdir);
    const rdir=new THREE.Vector3().crossVectors(fdir,up).normalize();
    if(fwd)camera.position.addScaledVector(fdir,fwd*v); if(rgt)camera.position.addScaledVector(rdir,rgt*v); if(vert)camera.position.addScaledVector(up,vert*v);
  }
  renderer.render(scene,camera);
})();
</script></body></html>
