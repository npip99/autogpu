[project]
name = "gpu"
version = "0.0.1"
description = "Minimal fp8 matmul GPU — pymodel + Verilog RTL"
# 3.12-only: libparse (openlane dep) ships cp312 wheels and its sdist is broken.
requires-python = ">=3.12,<3.13"
dependencies = [
    "cocotb>=2.0",
    "numpy>=2.0",
    "pytest>=8.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Synthesis toolchain. Opt-in via `uv sync --extra synth`.
synth = [
    "openlane>=2.3,<3",
]

[tool.pytest.ini_options]
# pythonpath="." lets pymodel.* modules `from config import ...` cleanly,
# but it also shadows experiments/adder/pymodel.py (a local file that
# happens to share a name with the GPU's pymodel package). So we don't
# collect experiments/ here — the adder experiment has its own Makefile
# and runs standalone via `cd experiments/adder && pytest test_pymodel.py`.
testpaths = ["pymodel/tests"]
pythonpath = ["."]
